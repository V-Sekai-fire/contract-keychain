[package]
name = "keychain_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "keychain_nif"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37"
# keyring 3 opts into each backend: apple-native is Security.framework, windows-native the
# Credential Vault, linux-native the kernel keyring (no libsecret or D-Bus).
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
